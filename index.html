<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบเช็กและแจ้งระดับกระดาษ Reuse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3f6f4;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #0f766e;
      --high: #15803d;
      --high-bg: #dcfce7;
      --med: #b45309;
      --med-bg: #fef3c7;
      --low: #b91c1c;
      --low-bg: #fee2e2;
    }

    * {
      box-sizing: border-box;
      font-family: 'Prompt', sans-serif;
    }

    body {
      margin: 0;
      padding: 20px 14px 44px;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
    }

    .top-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .top-header h1 {
      margin: 0 0 6px;
      font-size: 1.55rem;
      color: var(--accent);
    }

    .top-header p {
      margin: 0;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .sync-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #9ca3af;
    }

    .dot.ok { background: #16a34a; }
    .dot.busy { background: #d97706; }
    .dot.err { background: #dc2626; }

    .boxes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 16px;
    }

    .box-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
    }

    .tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: #e6fffa;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .box-card h2 {
      margin: 0 0 4px;
      font-size: 1.2rem;
    }

    .box-desc {
      margin: 0 0 16px;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .visual-panel {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px;
      border-radius: 14px;
      background: #f9fafb;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .bin {
      width: 78px;
      height: 108px;
      border: 3px solid #374151;
      border-top: none;
      border-radius: 0 0 12px 12px;
      background: #ffffff;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .bin-fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      transition: height 0.3s ease, background-color 0.3s ease;
    }

    .guide-line {
      position: absolute;
      left: 0;
      right: 0;
      border-top: 1px dashed rgba(55, 65, 81, 0.35);
      z-index: 2;
    }

    .g-high { top: 22%; }
    .g-med  { top: 55%; }
    .g-low  { top: 82%; }

    .level-meta {
      flex: 1;
    }

    .level-caption {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .level-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .badge-high { background: var(--high-bg); color: var(--high); }
    .badge-med  { background: var(--med-bg); color: var(--med); }
    .badge-low  { background: var(--low-bg); color: var(--low); }

    .last-update {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .pick-label {
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .pick-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .pick-btn {
      padding: 10px 6px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #ffffff;
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
